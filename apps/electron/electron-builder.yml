appId: com.ai-chatbox.mcp
productName: LeoChat
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json
extraResources:
  - from: "../../packages/leochat-mcp/dist/index.js"
    to: "leochat-mcp.js"
  - from: "../../packages/law-kb-mcp/dist/bundle.mjs"
    to: "mcp-servers/law-kb-mcp.mjs"
  - from: "../../packages/law-kb-mcp/data/laws.db"
    to: "mcp-servers/laws.db"
  - from: "../../packages/law-kb-mcp/data/model/Xenova/bge-small-zh-v1.5"
    to: "mcp-servers/model/Xenova/bge-small-zh-v1.5"
  - from: "../../build-resources/mcp-bundles/filesystem.js"
    to: "mcp-servers/filesystem.js"
  - from: "../../build-resources/mcp-bundles/everything.js"
    to: "mcp-servers/everything.js"
  - from: "../../node_modules/@modelcontextprotocol/server-memory/dist/index.js"
    to: "mcp-servers/memory.js"
  - from: "../../build-resources/mcp-bundles/fetch.js"
    to: "mcp-servers/fetch.js"
  - from: "../../build-resources/mcp-bundles/xhr-sync-worker.js"
    to: "mcp-servers/xhr-sync-worker.js"
extraMetadata:
  main: out/main/index.js
win:
  target:
    - zip
  signingHashAlgorithms:
    - sha256
  extraResources:
    - from: "../../build-resources/node.exe"
      to: "node.exe"
    - from: "../../build-resources/uv.exe"
      to: "uv.exe"
    - from: "../../mcp-servers/excel-mcp-server/dist/excel-mcp-server.exe"
      to: "mcp-servers/excel-mcp-server.exe"
    - from: "../../build-resources/word-mcp-server.exe"
      to: "mcp-servers/word-mcp-server.exe"
    # onnxruntime-node: placed at node_modules/onnxruntime-node so require() resolves
    # from resources/mcp-servers/ via normal Node.js directory traversal
    - from: "../../node_modules/onnxruntime-node/dist"
      to: "node_modules/onnxruntime-node/dist"
    - from: "../../node_modules/onnxruntime-node/bin/napi-v3/win32/x64"
      to: "node_modules/onnxruntime-node/bin/napi-v3/win32/x64"
    - from: "../../node_modules/onnxruntime-node/package.json"
      to: "node_modules/onnxruntime-node/package.json"
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
mac:
  target:
    - dmg
  hardenedRuntime: true
  gatekeeperAssess: false
linux:
  target:
    - AppImage
  category: Utility
