appId: com.ai-chatbox.mcp
productName: LeoChat
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json
extraResources:
  - from: "../../packages/leochat-mcp/dist/index.js"
    to: "leochat-mcp.js"
  - from: "../../node_modules/@modelcontextprotocol/server-filesystem/dist/index.js"
    to: "mcp-servers/filesystem.js"
  - from: "../../node_modules/@modelcontextprotocol/server-everything/dist/index.js"
    to: "mcp-servers/everything.js"
  - from: "../../node_modules/@modelcontextprotocol/server-memory/dist/index.js"
    to: "mcp-servers/memory.js"
  - from: "../../node_modules/@tokenizin/mcp-npx-fetch/dist/index.js"
    to: "mcp-servers/fetch.js"
extraMetadata:
  main: out/main/index.js
win:
  target:
    - nsis
  extraResources:
    - from: "../../mcp-servers/excel-mcp-server/dist/excel-mcp-server.exe"
      to: "mcp-servers/excel-mcp-server.exe"
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
mac:
  target:
    - dmg
  hardenedRuntime: true
  gatekeeperAssess: false
linux:
  target:
    - AppImage
  category: Utility
