appId: com.ai-chatbox.mcp
productName: LeoChat
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json
extraResources:
  - from: "../../packages/leochat-mcp/dist/index.js"
    to: "leochat-mcp.js"
  - from: "../../packages/law-kb-mcp/dist/bundle.mjs"
    to: "mcp-servers/law-kb-mcp.mjs"
  - from: "../../build-resources/mcp-bundles/filesystem.js"
    to: "mcp-servers/filesystem.js"
  - from: "../../build-resources/mcp-bundles/everything.js"
    to: "mcp-servers/everything.js"
  - from: "../../node_modules/@modelcontextprotocol/server-memory/dist/index.js"
    to: "mcp-servers/memory.js"
  - from: "../../build-resources/mcp-bundles/fetch.js"
    to: "mcp-servers/fetch.js"
  - from: "../../build-resources/mcp-bundles/xhr-sync-worker.js"
    to: "mcp-servers/xhr-sync-worker.js"
extraMetadata:
  main: out/main/index.js
win:
  target:
    - nsis
  # Code signing via SignPath (certificate thumbprint injected by CI)
  # When CSC_LINK / CSC_KEY_PASSWORD env vars are absent, signing is skipped automatically.
  signingHashAlgorithms:
    - sha256
  extraResources:
    - from: "../../build-resources/node.exe"
      to: "node.exe"
    - from: "../../build-resources/uv.exe"
      to: "uv.exe"
    - from: "../../mcp-servers/excel-mcp-server/dist/excel-mcp-server.exe"
      to: "mcp-servers/excel-mcp-server.exe"
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
mac:
  target:
    - dmg
  hardenedRuntime: true
  gatekeeperAssess: false
linux:
  target:
    - AppImage
  category: Utility
